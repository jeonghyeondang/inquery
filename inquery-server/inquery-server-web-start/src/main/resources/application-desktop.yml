# Desktop mode configuration - uses Embedded PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/inquery_desktop
    driver-class-name: org.postgresql.Driver
    username: inquery
    password: inquery
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 10821
  max-http-request-header-size: 48KB

inquery:
  mode: DESKTOP
  jwt:
    secret: ${JWT_SECRET:desktop-inquery-jwt-secret-local-only}
  cors:
    allowed-origins: http://localhost:3000,http://tauri.localhost,https://tauri.localhost,tauri://localhost
  gateway:
    base-url:
    model-base-url:
  desktop:
    embedded-postgres:
      enabled: true
      port: 15432
      database: inquery_desktop
