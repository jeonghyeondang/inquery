services:
  # PostgreSQL Database (pgvector-enabled for vector search support)
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inquery}
      POSTGRES_USER: ${POSTGRES_USER:-inquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inquery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./inquery-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inquery}
      DB_USERNAME: ${POSTGRES_USER:-inquery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inquery}
      JWT_SECRET: ${JWT_SECRET:-inquery-default-secret-key-please-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

  # SvelteKit Frontend
  frontend:
    build:
      context: ./inquery-client-svelte
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
